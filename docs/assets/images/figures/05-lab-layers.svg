<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="title desc">
  <title id="title">3ノードProxmox検証環境のレイヤ</title>
  <desc id="desc">3ノードのProxmox VE ClusterであるPVE Node 1、2、3が、それぞれKubernetes VMのcontrol-plane 1、worker 1、worker 2を配置する検証環境のレイヤ構成。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8Z" fill="#245b8f"/></marker></defs>
  <rect width="960" height="470" fill="#f8fafc"/><text x="40" y="48" font-family="sans-serif" font-size="27" font-weight="700" fill="#17324d">検証環境のレイヤ：Proxmox VE 3ノード</text>
  <rect x="65" y="85" width="830" height="145" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/><text x="95" y="121" font-family="sans-serif" font-size="23" font-weight="700" fill="#5f3b05">Proxmox VE Cluster（quorum を確認）</text>
  <rect x="110" y="145" width="190" height="55" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="205" y="180" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#5f3b05">PVE Node 1</text><rect x="385" y="145" width="190" height="55" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="480" y="180" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#5f3b05">PVE Node 2</text><rect x="660" y="145" width="190" height="55" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="755" y="180" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#5f3b05">PVE Node 3</text>
  <rect x="65" y="285" width="830" height="125" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="82" y="311" font-family="sans-serif" font-size="17" font-weight="700" fill="#17324d">Kubernetes</text><text x="82" y="332" font-family="sans-serif" font-size="17" font-weight="700" fill="#17324d">Nodes（VM）</text><rect x="110" y="342" width="190" height="45" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="205" y="371" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#17324d">control-plane 1</text><rect x="385" y="342" width="190" height="45" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="480" y="371" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#17324d">worker 1</text><rect x="660" y="342" width="190" height="45" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="755" y="371" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#17324d">worker 2</text>
  <path d="M205 200V342" stroke="#245b8f" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M480 200V342" stroke="#245b8f" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M755 200V342" stroke="#245b8f" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="40" y="445" font-family="sans-serif" font-size="16" fill="#475569">検証では、PVEクラスタの停止線とKubernetes VMの役割を別レイヤとして記録する。</text>
</svg>
