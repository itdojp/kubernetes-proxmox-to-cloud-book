<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
  <title id="title">baseとoverlayまたはvaluesによる差分吸収</title>
  <desc id="desc">共通のKustomize baseから検証用overlayと本番用overlayを派生させ、共通のHelm valuesから検証用valuesと本番用valuesを派生させる。共通定義と環境差分の分離を示す。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8Z" fill="#245b8f"/></marker></defs>
  <rect width="960" height="480" fill="#f8fafc"/><text x="40" y="48" font-family="sans-serif" font-size="27" font-weight="700" fill="#17324d">差分吸収：base + overlays / values</text>
  <rect x="65" y="95" width="360" height="325" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="95" y="132" font-family="sans-serif" font-size="23" font-weight="700" fill="#17324d">Kustomize</text><rect x="155" y="165" width="180" height="68" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="245" y="194" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#17324d">共通：base</text><text x="245" y="216" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#17324d">共通リソース</text><rect x="95" y="295" width="130" height="68" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="160" y="324" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#5f3b05">検証</text><text x="160" y="347" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#5f3b05">overlay/dev</text><rect x="265" y="295" width="130" height="68" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="330" y="324" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#14532d">本番</text><text x="330" y="347" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#14532d">overlay/prod</text><path d="M245 233V260H160V285" stroke="#245b8f" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M245 233V260H330V285" stroke="#245b8f" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <rect x="535" y="95" width="360" height="325" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="3"/><text x="565" y="132" font-family="sans-serif" font-size="23" font-weight="700" fill="#3b1b76">Helm</text><rect x="625" y="165" width="180" height="68" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="715" y="194" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#3b1b76">共通：values</text><text x="715" y="216" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#3b1b76">共通パラメータ</text><rect x="565" y="295" width="130" height="68" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="630" y="324" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#5f3b05">検証</text><text x="630" y="347" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#5f3b05">values-dev</text><rect x="735" y="295" width="130" height="68" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="800" y="324" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#14532d">本番</text><text x="800" y="347" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#14532d">values-prod</text><path d="M715 233V260H630V285" stroke="#5b2a86" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M715 233V260H800V285" stroke="#5b2a86" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="40" y="455" font-family="sans-serif" font-size="16" fill="#475569">共通部分を複製せず、環境固有の値と実装だけを明示的な差分として管理する。</text>
</svg>
