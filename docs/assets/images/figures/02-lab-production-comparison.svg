<svg xmlns="http://www.w3.org/2000/svg" width="960" height="650" viewBox="0 0 960 650" role="img" aria-labelledby="title desc">
  <title id="title">検証環境と本番環境のアーキテクチャ比較</title>
  <desc id="desc">左はProxmox VEとkubeadmによる検証環境で、control-plane VM 1台とworker VM 2台のすべてがCNI、ロードバランサー、Ingress、ストレージのアドオン群に接続する。右はクラウド内のManaged KubernetesがCloud Load Balancer、Managed Storage、IAMまたはSSOに接続する。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8Z" fill="#245b8f"/></marker></defs>
  <rect width="960" height="650" fill="#f8fafc"/>
  <text x="40" y="48" font-family="sans-serif" font-size="27" font-weight="700" fill="#17324d">アーキテクチャ比較：検証 vs 本番</text>

  <rect x="25" y="80" width="445" height="500" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text x="50" y="117" font-family="sans-serif" font-size="23" font-weight="700" fill="#17324d">検証：Proxmox + kubeadm</text>
  <rect x="155" y="140" width="180" height="60" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="245" y="177" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#5f3b05">Proxmox VE</text>
  <path d="M245 200V225H102V245" stroke="#9a5a0a" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M245 200V245" stroke="#9a5a0a" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M245 200V225H388V245" stroke="#9a5a0a" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <rect x="45" y="245" width="115" height="62" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="102" y="272" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#5f3b05">VM</text><text x="102" y="294" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#5f3b05">control-plane</text>
  <rect x="188" y="245" width="115" height="62" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="245" y="272" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#5f3b05">VM</text><text x="245" y="294" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#5f3b05">worker 1</text>
  <rect x="331" y="245" width="115" height="62" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="388" y="272" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#5f3b05">VM</text><text x="388" y="294" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#5f3b05">worker 2</text>
  <path d="M102 307V365" stroke="#245b8f" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M245 307V365" stroke="#245b8f" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M388 307V365" stroke="#245b8f" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="55" y="365" width="380" height="155" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="245" y="397" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#14532d">Addons（3 VMから利用）</text>
  <rect x="80" y="420" width="145" height="38" rx="6" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="152" y="445" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#14532d">CNI</text>
  <rect x="265" y="420" width="145" height="38" rx="6" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="337" y="445" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#14532d">LB / Ingress</text>
  <rect x="172" y="470" width="145" height="38" rx="6" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="244" y="495" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#14532d">Storage</text>

  <rect x="500" y="80" width="435" height="500" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
  <text x="525" y="117" font-family="sans-serif" font-size="23" font-weight="700" fill="#14532d">本番：クラウド</text>
  <rect x="650" y="140" width="145" height="60" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="722" y="177" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#17324d">Cloud</text>
  <path d="M722 200V245" stroke="#245b8f" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="622" y="245" width="200" height="70" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="722" y="274" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#14532d">Managed</text><text x="722" y="298" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#14532d">Kubernetes</text>
  <path d="M722 315V350H570V390" stroke="#245b8f" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M722 315V390" stroke="#245b8f" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M722 315V350H875V390" stroke="#245b8f" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <rect x="520" y="390" width="100" height="78" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="570" y="421" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#17324d">Cloud Load</text><text x="570" y="444" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#17324d">Balancer</text>
  <rect x="657" y="390" width="130" height="78" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="722" y="421" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#17324d">Managed</text><text x="722" y="444" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#17324d">Storage</text>
  <rect x="825" y="390" width="100" height="78" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="875" y="421" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#3b1b76">IAM / SSO</text><text x="875" y="444" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#3b1b76">Identity</text>
  <text x="718" y="520" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#14532d">クラウド境界が各マネージド機能を提供</text>

  <text x="40" y="625" font-family="sans-serif" font-size="16" fill="#475569">検証実装をそのまま持ち込まず、LB・Storage・Identityの置換責務を切替前に明確化する。</text>
</svg>
