{{- if .Values.gateway.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "sample-app.fullname" . }}
  labels:
    app.kubernetes.io/name: sample-app
spec:
  gatewayClassName: {{ required "gateway.className must be set when gateway.enabled=true" .Values.gateway.className }}
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: {{ .Values.gateway.host }}
      allowedRoutes:
        namespaces:
          from: Same
{{- end -}}
