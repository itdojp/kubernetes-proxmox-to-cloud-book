replicaCount: 3

image:
  repository: docker.io/hashicorp/http-echo
  tag: "0.2.3"

app:
  text: "sample-app (helm cloud-prod)"

gateway:
  enabled: false

ingress:
  enabled: true
  className: alb
  host: sample-app.example.com

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi
