apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sample-app

resources:
  - ../../base
  - ingress.yaml

configMapGenerator:
  - name: sample-app-config
    behavior: merge
    literals:
      - TEXT=sample-app (cloud-prod)

patches:
  - path: patch-replicas.yaml
    target:
      kind: Deployment
      name: sample-app
  - path: patch-resources.yaml
    target:
      kind: Deployment
      name: sample-app
  - path: delete-gateway.yaml
  - path: delete-httproute.yaml
